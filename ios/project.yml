name: Cliamp

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  CliampCore:
    path: CliampCore

targets:
  Cliamp:
    type: application
    platform: iOS
    sources:
      - path: Cliamp/Sources
    dependencies:
      - package: CliampCore
    info:
      path: Cliamp/Info.plist
      properties:
        CFBundleDisplayName: cliamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stream.cliamp.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - CliampTests
      gatherCoverageData: false

  CliampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Cliamp/Tests
    dependencies:
      - target: Cliamp
      - package: CliampCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stream.cliamp.mobile.tests
